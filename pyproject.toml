[project]
name = "n8n-support-agent"
version = "0.1.0"
description = "n8n support agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
n8n-support-agent = "n8n_support_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real API (costs money, needs ANTHROPIC_API_KEY)",
]
addopts = "-m 'not integration' --strict-markers"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.build-backend]
module-name = "n8n_support_agent"